name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend unit tests (no real Firebase / Gemini) ─────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-microservice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-microservice/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: test-key
          FIREBASE_API_KEY: test-key
          FIREBASE_PROJECT_ID: test-project
        run: pytest tests/ --ignore=tests/test_api_pytest.py --cov=app --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend-microservice/coverage.xml
          flags: backend
        continue-on-error: true   # don't fail the build if Codecov is down

  # ── 2. Docker build check ─────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-unit

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t backend-test backend-microservice/
