name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend unit tests (no real Firebase / Gemini) ─────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-microservice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-microservice/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: test-key
          FIREBASE_API_KEY: test-key
          FIREBASE_PROJECT_ID: test-project
        run: pytest --cov=app --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend-microservice/coverage.xml
          flags: backend
        continue-on-error: true   # don't fail the build if Codecov is down

  # ── 2. Frontend unit tests ─────────────────────────────────────────────────
  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── 3. Frontend build (validates env vars + TypeScript) ───────────────────
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: frontend-unit
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── 4. Docker build check ─────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-unit

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t backend-test backend-microservice/

  # ── 5. E2E tests (runs the full stack via Docker Compose) ─────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    # Only run E2E on main / pushes (skip on forks / dependabot)
    if: github.event_name == 'push' && github.repository_owner == 'Ishmam97'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Write frontend .env for stack
        run: |
          cat > frontend/.env <<EOF
          VITE_API_BASE_URL=http://localhost:8000
          VITE_WS_BASE_URL=ws://localhost:8000
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Write backend .env for stack
        run: |
          cat > backend-microservice/.env <<EOF
          ENVIRONMENT=development
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          EOF

      - name: Start stack
        run: docker compose up -d --build
        timeout-minutes: 5

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && \
            curl -sf http://localhost:8080 && break || sleep 3
          done

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          API_BASE_URL: http://localhost:8000
        run: npx playwright test --config playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down
