name: Deploy to Cloud Run

on:
  push:
    branches: [main]

# Required GitHub Secrets:
#   GCP_PROJECT_ID          — Google Cloud project ID
#   GCP_REGION              — e.g. us-central1
#   GCP_SERVICE_ACCOUNT_KEY — JSON key for a service account with roles:
#                             Cloud Run Admin, Storage Admin, Artifact Registry Writer,
#                             Secret Manager Secret Accessor
#
# Required Secret Manager secrets (owner must create these in GCP before this
# workflow can deploy successfully — `--set-secrets` below only references them):
#   OPENAI_API_KEY
#   GEMINI_API_KEY
#   FIREBASE_API_KEY
#
# Dry-run mode: until GCP_SERVICE_ACCOUNT_KEY is set, the job only builds the
# image (proving the Dockerfile still works) and skips push and deploy, so the
# workflow stays green without a paid GCP project.

jobs:
  deploy-backend:
    name: Deploy backend → Cloud Run
    runs-on: ubuntu-latest
    env:
      GCP_ENABLED: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t interviewer-backend:${{ github.sha }} backend-microservice/

      - name: Dry run — skip deploy (no GCP credentials configured)
        if: env.GCP_ENABLED != 'true'
        run: echo "::notice::GCP_SERVICE_ACCOUNT_KEY is not set; image built, push and Cloud Run deploy skipped."

      - name: Authenticate to Google Cloud
        if: env.GCP_ENABLED == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_ENABLED == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: env.GCP_ENABLED == 'true'
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Push backend image
        if: env.GCP_ENABLED == 'true'
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/interviewer/backend:${{ github.sha }}
        run: |
          docker tag interviewer-backend:${{ github.sha }} $IMAGE
          docker push $IMAGE

      - name: Deploy to Cloud Run
        if: env.GCP_ENABLED == 'true'
        id: deploy
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/interviewer/backend:${{ github.sha }}
        run: |
          gcloud run deploy interviewer-backend \
            --image $IMAGE \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --timeout=1800 \
            --min-instances=1 \
            --max-instances=1 \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,FIREBASE_API_KEY=FIREBASE_API_KEY:latest \
            --set-env-vars="^;^OPENAI_BASE_URL=https://api.aimlapi.com/v1;ENVIRONMENT=production;FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }};CORS_ALLOWED_ORIGINS=https://interviewerai-ias.web.app,https://interviewerai-ias.firebaseapp.com" \
            --format='value(status.url)' > service_url.txt
          echo "url=$(cat service_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Show deployed URL
        if: env.GCP_ENABLED == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
